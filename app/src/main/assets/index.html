<script>
window.COURSE_DATA = {"course": {"unit1FullText": "Unité 1 : Invitation. Les vacances sont vite passées. Jean Morelle et sa femme Suzanne sont rentrés au Caire. Gamal les a invités chez lui avec Moustafa, pilote à EgyptAir.", "unit1FullTextArabic": "الوحدة الأولى : الدعوة. مرت الإجازة بسرعة. عاد جان موريل وزوجته سوزان إلى القاهرة. دعاهما جمال إلى منزله مع مصطفى، طيار في مصر للطيران.", "unit1Dialogues": [{"speaker": "Récit du texte", "text": "« Les vacances sont vite passées. Jean Morelle et sa femme Suzanne sont rentrés au Caire. Gamal les a invités chez lui avec Moustafa (pilote à EgyptAir). »", "arabicNote": "مرت الإجازة بسرعة. عاد جان وزوجته سوزان إلى القاهرة. دعاهما جمال إلى منزله مع مصطفى (طيار بمصر للطيران)."}, {"speaker": "Jean Morelle", "text": "« Tiens Gamal. Ce livre, nous l'avons acheté pour toi. »", "arabicNote": "تفضل يا جمال. هذا الكتاب اشتريناه لك (كتاب تاريخ هدية). 📚"}, {"speaker": "Gamal", "text": "« Oh ! Merci beaucoup. Les livres d'histoire, moi, je les adore ! J'ai passé mes vacances à la Mer Rouge avec mes élèves. »", "arabicNote": "أوه! شكراً جزيلاً. كتب التاريخ أنا أعشقها! قضيت إجازتي في البحر الأحمر مع تلاميذي."}, {"speaker": "Moustafa", "text": "« Moi, je n'ai pas eu de vacances cette année. Je suis pilote à EgyptAir. »", "arabicNote": "أما أنا، فلم أحصل على إجازة هذا العام. أنا طيار في مصر للطيران. ✈️"}], "unit1Ex2RepondsAuxQuestions": [{"id": "u1_ex2_a", "question": "a- Où Gamal a-t-il invité ses amis français ?", "options": ["Chez lui (à la maison)", "Au restaurant", "Au club"], "correctIndex": 0, "explanation": "Gamal a invité ses amis français chez lui.", "arabicTranslation": "أين دعا جمال أصدقاءه الفرنسيين؟ ➔ في منزله (Chez lui)."}, {"id": "u1_ex2_b", "question": "b- Avec qui Suzanne est-elle rentrée au Caire ?", "options": ["Avec son mari Jean", "Avec Moustafa", "Avec ses élèves"], "correctIndex": 0, "explanation": "Suzanne est rentrée au Caire avec son mari Jean Morelle.", "arabicTranslation": "مع من عادت سوزان إلى القاهرة؟ ➔ مع زوجها جان (Avec son mari Jean)."}, {"id": "u1_ex2_c", "question": "c- À qui Gamal a – t – il présenté Moustafa ?", "options": ["À ses amis français (Jean et Suzanne)", "À ses élèves", "À son père"], "correctIndex": 0, "explanation": "Gamal a présenté Moustafa à Jean et Suzanne : « Je vous présente Moustafa ».", "arabicTranslation": "إلى من قدّم جمال صديقه مصطفى؟ ➔ إلى أصدقائه الفرنسيين (جان وسوزان)."}], "unit1Ex3VraiOuFaux": [{"id": "u1_ex3_a", "question": "a- Moustafa est l'ami de Jean.", "options": ["Faux (خطأ)", "Vrai (صح)"], "correctIndex": 0, "explanation": "Faux : Moustafa est l'ami égyptien de Gamal (pilote à EgyptAir).", "arabicTranslation": "مصطفى هو صديق جان ➔ [خطأ Faux]. مصطفى هو صديق جمال."}, {"id": "u1_ex3_b", "question": "b- Gamal aime beaucoup les livres d'histoire.", "options": ["Vrai (صح)", "Faux (خطأ)"], "correctIndex": 0, "explanation": "Vrai : Gamal dit : « Les livres d'histoire, moi, je les adore ! »", "arabicTranslation": "جمال يحب كتب التاريخ كثيراً ➔ [صح Vrai]. قال جمال: 'Les livres d'histoire, moi, je les adore !'"}, {"id": "u1_ex3_c", "question": "c- Sur la table, il y a beaucoup de livres.", "options": ["Faux (خطأ)", "Vrai (صح)"], "correctIndex": 0, "explanation": "Faux : Sur la table, il y a des gâteaux et des boissons fraîches.", "arabicTranslation": "على الطاولة يوجد الكثير من الكتب ➔ [خطأ Faux]. على الطاولة توجد حلوى ومشروبات باردة."}, {"id": "u1_ex3_d", "question": "d- Gamal n'est pas content de ses vacances.", "options": ["Faux (خطأ)", "Vrai (صح)"], "correctIndex": 0, "explanation": "Faux : Gamal a passé de très bonnes vacances à la Mer Rouge avec ses élèves.", "arabicTranslation": "جمال ليس سعيداً بإجازته ➔ [خطأ Faux]. قضى جمال إجازة سعيدة جداً في البحر الأحمر."}], "unit1Ex4Associe": [{"id": "u1_ex4_a", "question": "a- Moustafa est :", "options": ["4) L'ami de Gamal.", "1) au bord de la mer", "2) pendant la Soirée", "3) à la Mer Rouge.", "5) des monuments français"], "correctIndex": 0, "explanation": "Moustafa est l'ami de Gamal.", "arabicTranslation": "مصطفى يكون ➔ 4) صديق جمال (L'ami de Gamal)."}, {"id": "u1_ex4_b", "question": "b- Gamal a passé ses vacances :", "options": ["3) à la Mer Rouge.", "1) au bord de la mer", "2) pendant la Soirée", "4) L'ami de Gamal.", "5) des monuments français"], "correctIndex": 0, "explanation": "Gamal a passé ses vacances à la Mer Rouge.", "arabicTranslation": "جمال قضى إجازته ➔ 3) في البحر الأحمر (à la Mer Rouge)."}, {"id": "u1_ex4_c", "question": "c- Le livre d'histoire parle :", "options": ["5) des monuments français", "1) au bord de la mer", "2) pendant la Soirée", "3) à la Mer Rouge.", "4) L'ami de Gamal."], "correctIndex": 0, "explanation": "Le livre d'histoire parle des monuments français.", "arabicTranslation": "كتاب التاريخ يتحدث عن ➔ 5) المعالم والآثار الفرنسية (des monuments français)."}, {"id": "u1_ex4_d", "question": "d- Moustafa n'est pas allé :", "options": ["1) au bord de la mer", "2) pendant la Soirée", "3) à la Mer Rouge.", "4) L'ami de Gamal.", "5) des monuments français"], "correctIndex": 0, "explanation": "Moustafa n'a pas eu de vacances, il n'est pas allé au bord de la mer.", "arabicTranslation": "مصطفى لم يذهب ➔ 1) إلى شاطئ البحر (au bord de la mer)."}, {"id": "u1_ex4_e", "question": "e- Les amis ont beaucoup parlé :", "options": ["2) pendant la Soirée", "1) au bord de la mer", "3) à la Mer Rouge.", "4) L'ami de Gamal.", "5) des monuments français"], "correctIndex": 0, "explanation": "Les amis ont beaucoup parlé pendant la Soirée.", "arabicTranslation": "الأصدقاء تحدثوا كثيراً ➔ 2) أثناء السهرة (pendant la Soirée)."}], "unit1Ex5Complete": [{"id": "u1_ex5_1", "question": "1. Gamal a reçu jean Morelle, sa ______ et son ______ Moustafa chez lui.", "options": ["femme (Suzanne) / ami", "sœur / cousin", "mère / frère"], "correctIndex": 0, "explanation": "Gamal a reçu Jean Morelle, sa femme Suzanne et son ami Moustafa.", "arabicTranslation": "استقبل جمال جان موريل وزوجته (سوزان) وصديقه مصطفى في منزله."}, {"id": "u1_ex5_2", "question": "2. IL était جمع (COD pluriel)، يستبدل بـ (les) ويوضع أمام الفعل المصرف (aiment). ملحوظة: ضمير الجمع (les) لا يختصر أمام المتحرك.", "ruleTag": "C.O.D (جمع مذكر/مؤنث ➔ les)", "positionRuleAr": "يوضع أمام الفعل المصرف (les aiment).", "pageReference": "p. 23"}, {"id": "u1_pr_ex_6", "number": 6, "fullSentenceFr": "J'ai répondu à mon professeur.", "underlinedPart": "à mon professeur", "category": "COI", "targetPronoun": "lui", "options": ["lui", "le", "leur"], "transformedSentenceFr": "Je lui ai répondu.", "sentenceAr": "لقد أجبت أستاذي.", "transformedSentenceAr": "لقد أجبت عليه.", "explanationAr": "« à mon professeur » مفعول غير مباشر عاقل مفرد مسبوق بـ (à). في زمن الماضي المركب (passé composé)، يوضع الضمير قبل الفعل المساعد (ai).", "ruleTag": "C.O.I (مفرد عاقل + يوضع قبل المساعد ai)", "positionRuleAr": "يوضع قبل الفعل المساعد (ai) في الماضي المركب.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_7", "number": 7, "fullSentenceFr": "Les professeurs expliquent les leçons.", "underlinedPart": "Les professeurs ... les leçons", "category": "COD", "targetPronoun": "Ils / les", "options": ["Ils les expliquent.", "Ils expliquent les leçons.", "Les professeurs leur expliquent."], "transformedSentenceFr": "Ils les expliquent.", "sentenceAr": "الأساتذة يشرحون الدروس.", "transformedSentenceAr": "هم يشرحونها.", "explanationAr": "في كتيّب المعهد تم وضع خط تحت الفاعل «Les professeurs» (جمع مذكر ➔ Ils) وتحت المفعول المباشر الجمع «les leçons» (جمع مباشر ➔ les)؛ فتصبح الجملة بالكامل: Ils les expliquent.", "ruleTag": "Sujet + COD (استبدال مزدوج: Ils + les)", "positionRuleAr": "استبدال الفاعل بـ Ils ووضع les قبل الفعل المصرف.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_8", "number": 8, "fullSentenceFr": "Vous aimez ce pantalon.", "underlinedPart": "ce pantalon", "category": "COD", "targetPronoun": "l'", "options": ["l'", "le", "lui"], "transformedSentenceFr": "Vous l'aimez.", "sentenceAr": "أنتم تحبون هذا البنطال.", "transformedSentenceAr": "أنتم تحبونه.", "explanationAr": "« ce pantalon » مفعول به مباشر مفرد مذكر (COD). يوضع قبل الفعل (aimez) ولأنه يبدأ بحرف متحرك (a)، تتحول (le) إلى (l').", "ruleTag": "C.O.D (مفرد مذكر + فعل يبدأ بمتحرك ➔ l')", "positionRuleAr": "يوضع قبل الفعل المصرف ويبدأ بمتحرك.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_9", "number": 9, "fullSentenceFr": "Il fait son devoir.", "underlinedPart": "son devoir", "category": "COD", "targetPronoun": "le", "options": ["le", "lui", "la"], "transformedSentenceFr": "Il le fait.", "sentenceAr": "هو يؤدي واجبه.", "transformedSentenceAr": "هو يؤديه.", "explanationAr": "« son devoir » مفعول مباشر مفرد مذكر (COD)، يستبدل بالضمير (le) ويوضع مباشرة أمام الفعل المصرف (fait).", "ruleTag": "C.O.D (مفرد مذكر بدون حرف جر ➔ le)", "positionRuleAr": "يوضع أمام الفعل المصرف مباشرةً.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_10", "number": 10, "fullSentenceFr": "Il offre un cadeau à son père.", "underlinedPart": "à son père", "category": "COI", "targetPronoun": "lui", "options": ["lui", "le", "leur"], "transformedSentenceFr": "Il lui offre un cadeau.", "sentenceAr": "هو يقدم هدية لوالده.", "transformedSentenceAr": "هو يقدم له هدية.", "explanationAr": "« à son père » مفعول به غير مباشر عاقل مفرد مسبوق بـ (à)، يستبدل بـ (lui) ويوضع قبل الفعل (offre) مع بقاء المفعول المباشر un cadeau.", "ruleTag": "C.O.I (مفرد عاقل مسبوق بـ à ➔ lui)", "positionRuleAr": "يوضع قبل الفعل المصرف (Il lui offre un cadeau).", "pageReference": "p. 23"}, {"id": "u1_pr_ex_11", "number": 11, "fullSentenceFr": "Rami et moi jouons au tennis.", "underlinedPart": "Rami et moi", "category": "SUJET", "targetPronoun": "Nous", "options": ["Nous", "Vous", "Ils"], "transformedSentenceFr": "Nous jouons au tennis.", "sentenceAr": "رامي وأنا نلعب التنس.", "transformedSentenceAr": "نحن نلعب التنس.", "explanationAr": "« Rami et moi » قاعدة ص 20 الرسمية: (un nom + moi) يُستبدل بضمير الفاعل (Nous).", "ruleTag": "Sujet (اسم + moi ➔ Nous)", "positionRuleAr": "يحل محل الفاعل في بداية الجملة.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_12", "number": 12, "fullSentenceFr": "Ali a mangé le sandwich.", "underlinedPart": "le sandwich", "category": "COD", "targetPronoun": "l'", "options": ["l'", "le", "lui"], "transformedSentenceFr": "Ali l'a mangé.", "sentenceAr": "علي أكل الساندويتش.", "transformedSentenceAr": "علي أكله.", "explanationAr": "« le sandwich » مفعول مباشر مفرد مذكر. يوضع قبل المساعد (a) في الماضي المركب، وبما أن (a) حرف متحرك، تصبح (le) ➔ (l').", "ruleTag": "C.O.D (مفرد مذكر + مساعد يبدأ بمتحرك ➔ l')", "positionRuleAr": "يوضع قبل الفعل المساعد (a) في الماضي المركب.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_13", "number": 13, "fullSentenceFr": "Elle va téléphoner aux directeurs.", "underlinedPart": "aux directeurs", "category": "COI", "targetPronoun": "leur", "options": ["leur", "les", "leurs"], "transformedSentenceFr": "Elle va leur téléphoner.", "sentenceAr": "هي سوف تتصل بالمديرين.", "transformedSentenceAr": "هي سوف تتصل بهم.", "explanationAr": "« aux directeurs » مفعول غير مباشر جمع عاقل مسبوق بـ (aux)، يستبدل بـ (leur بدون s). وعند وجود فعلين (مصرف + مصدر)، يوضع الضمير قبل المصدر (téléphoner).", "ruleTag": "C.O.I (جمع عاقل + يوضع قبل المصدر ➔ leur)", "positionRuleAr": "يوضع قبل الفعل في المصدر (téléphoner).", "pageReference": "p. 23"}, {"id": "u1_pr_ex_14", "number": 14, "fullSentenceFr": "Il prend ces cahiers.", "underlinedPart": "ces cahiers", "category": "COD", "targetPronoun": "les", "options": ["les", "leur", "des"], "transformedSentenceFr": "Il les prend.", "sentenceAr": "هو يأخذ هذه الكراريس.", "transformedSentenceAr": "هو يأخذها.", "explanationAr": "« ces cahiers » مفعول به مباشر جمع (ينتهي بـ s)، يستبدل بالضمير (les) ويوضع مباشرة أمام الفعل المصرف (prend).", "ruleTag": "C.O.D (جمع مباشر ➔ les)", "positionRuleAr": "يوضع أمام الفعل المصرف مباشرةً.", "pageReference": "p. 23"}, {"id": "u1_pr_ex_15", "number": 15, "fullSentenceFr": "Karim et toi êtes gentils.", "underlinedPart": "Karim et toi", "category": "SUJET", "targetPronoun": "Vous", "options": ["Vous", "Nous", "Ils"], "transformedSentenceFr": "Vous êtes gentils.", "sentenceAr": "كريم وأنت لطفاء.", "transformedSentenceAr": "أنتم لطفاء.", "explanationAr": "« Karim et toi » قاعدة ص 20 الرسمية: (un nom + toi) يُستبدل بضمير المخاطب الجمع (Vous).", "ruleTag": "Sujet (اسم + toi ➔ Vous)", "positionRuleAr": "يحل محل الفاعل في بداية الجملة.", "pageReference": "p. 23"}], "unit1FaisDesPhrasesList": [{"id": "u1_fp_1", "number": 1, "promptFr": "Préparer – le diner", "promptAr": "يُجهّز / يُعِدّ – العشاء", "verbInfinitive": "Préparer", "complement": "le dîner", "modelSentenceFr": "Maman prépare le dîner.", "modelSentenceAr": "ماما تُعِدّ العشاء.", "scrambledWords": ["prépare", "Maman", "le", "dîner."], "correctOrder": ["Maman", "prépare", "le", "dîner."], "grammarTipAr": "فعل (Préparer) من أفعال المجموعة الأولى (1er groupe) المنتهية بـ -er. عند تصريفه في المضارع مع (Maman = Elle) نحذف -er ونضيف e ➔ prépare. بنية الجملة البسيطة في الفرنسية: فاعل (Sujet) + فعل مصرف (Verbe) + مفعول (Complément).", "pageReference": "p. 24"}, {"id": "u1_fp_2", "number": 2, "promptFr": "Adorer – livres d'histoire .", "promptAr": "يعشق / يحب بشدة – كتب التاريخ", "verbInfinitive": "Adorer", "complement": "les livres d'histoire", "modelSentenceFr": "J'adore les livres d'histoire.", "modelSentenceAr": "أنا أعشق كتب التاريخ.", "scrambledWords": ["les", "J'adore", "d'histoire.", "livres"], "correctOrder": ["J'adore", "les", "livres", "d'histoire."], "grammarTipAr": "فعل (Adorer) يبدأ بحرف متحرك (A)، لذلك مع ضمير المتكلم Je يتحول إلى (J'adore) بحذف حرف الـ e ووضع الفاصلة العليا (l'apostrophe). لاحظ أيضاً إضافة أداة المعرفة الجمع (les) قبل كلمة livres، لأن أفعال الميول والتفضيل (aimer, adorer, préférer) تأخذ دائماً أدوات معرفة (le, la, les).", "pageReference": "p. 24"}, {"id": "u1_fp_3", "number": 3, "promptFr": "acheter un billet – pour le Caire.", "promptAr": "يشتري تذكرة – إلى القاهرة", "verbInfinitive": "Acheter", "complement": "un billet pour le Caire", "modelSentenceFr": "J'achète un billet pour le Caire.", "modelSentenceAr": "أنا أشتري تذكرة إلى القاهرة.", "scrambledWords": ["un", "J'achète", "pour", "billet", "le Caire."], "correctOrder": ["J'achète", "un", "billet", "pour", "le Caire."], "grammarTipAr": "فعل (Acheter) يبدأ بحرف متحرك لذلك مع Je يصبح (J'achète). انتبه للنبرة المائلة (accent grave) على حرف الـ e في (achète, achètes, achètent). كما أن القاهرة تأخذ أداة المعرفة المذكرة (le Caire) وحرف الجر pour يعني (إلى / من أجل).", "pageReference": "p. 24"}, {"id": "u1_fp_4", "number": 4, "promptFr": "Passer – Vacances", "promptAr": "يقضي – الإجازة / العطلة", "verbInfinitive": "Passer", "complement": "les vacances", "modelSentenceFr": "Je passe les vacances à Alexandrie.", "modelSentenceAr": "أنا أقضي الإجازة في الإسكندرية.", "scrambledWords": ["les", "Je", "passe", "à Alexandrie.", "vacances"], "correctOrder": ["Je", "passe", "les", "vacances", "à Alexandrie."], "grammarTipAr": "فعل (Passer) عند استخدامه مع الوقت أو الإجازة يعني (يقضي). كلمة (Vacances) في اللغة الفرنسية تأتي بصيغة الجمع المؤنث دائماً (les vacances). نستخدم حرف الجر (à) مع المدن: (à Alexandrie, à Louxor, à Assouan).", "pageReference": "p. 24"}], "unit2FullText": "Unité 2 : Repas & Restaurant. Le 15 juin à l'occasion de leur fête de mariage, Jean Morelle et sa femme ont invité des amis à dîner à 22 heures. Ils ont réservé une table pour 20 personnes dans un grand restaurant. De retour chez lui, Gamal a parlé de la soirée avec ses parents. Le père : Ça s'est bien passé ? Gamal : Oui, J'ai rencontré les amis français de Jean, des journalistes et des stagiaires d'El Ahram Hebdo on a très bien mangé. Le père : Qu'est-ce qu'on a servi ? Gamal : Comme entrée, on a servi des crudités : des tomates, des concombres en salade et des laitues. Comme plat principal : du veau ou du poulet avec des frites et des légumes. Et comme dessert : des fruits de toutes sortes et un gâteau au chocolat en forme de pyramide avec 5 bougies. La mère : Et tu as bien mangé ? Gamal : Bien sûr.", "unit2FullTextArabic": "الوحدة الثانية : الوجبات والمطعم. في 15 يونيو بمناسبة عيد زواجهما، دعا جان موريل وزوجته الأصدقاء لتناول العشاء في الساعة العاشرة مساءً (22h). وحجزوا طاولة لـ 20 شخصاً في مطعم كبير. ولدى عودته، تحدث جمال عن السهرة مع والديه. الأب: هل سارت الأمور بخير؟ جمال: نعم، قابلت أصدقاء جان الفرنسيين، صحفيين ومتدربين بجريدة الأهرام إبدو، وأكلنا بشكل ممتاز. الأب: ماذا قُدِّم في العشاء؟ جمال: كمقبلات قُدِّمت خضروات طازجة (طماطم وخيار سلطة وخس)، وطبق رئيسي لحم بتلو أو دجاج مع بطاطس وخضار، والتحلية فواكه وكعكة شوكولاتة على شكل هرم بـ 5 شمعات. الأم: وهل أكلت جيداً؟ جمال: بكل تأكيد!", "unit2Dialogues": [{"speaker": "Récit du texte (ص 35)", "text": "« Le 15 juin à l'occasion de leur fête de mariage, Jean Morelle et sa femme ont invité des amis à dîner à 22 heures. Ils ont réservé une table pour 20 personnes dans un grand restaurant. De retour chez lui, Gamal a parlé de la soirée avec ses parents. »", "arabicNote": "في 15 يونيو بمناسبة عيد زواجهما، دعا جان موريل وزوجته أصدقاءهما لتناول العشاء في الساعة العاشرة مساءً (22h). وحجزوا طاولة لـ 20 شخصاً في مطعم كبير. ولدى عودته إلى المنزل، تحدث جمال عن السهرة مع والديه. 🍽️"}, {"speaker": "Le père", "text": "« Ça s'est bien passé ? »", "arabicNote": "هل سارت الأمور على ما يرام؟ (كيف كانت السهرة؟) 👨"}, {"speaker": "Gamal", "text": "« Oui, J'ai rencontré les amis français de Jean, des journalistes et des stagiaires d'El Ahram Hebdo on a très bien mangé. »", "arabicNote": "نعم، لقد التقيت بأصدقاء جان الفرنسيين، وهم صحفيون ومتدربون بجريدة الأهرام إبدو (El Ahram Hebdo)، وقد تناولنا طعاماً لذيذاً جداً. 📰"}, {"speaker": "Le père", "text": "« Qu'est – ce qu'on a servi ? »", "arabicNote": "ماذا قُدِّم في قائمة الطعام؟ ❓"}, {"speaker": "Gamal (Menu du dîner)", "text": "« Comme entrée, on a servi des crudités : des tomates, des concombres en salade et des laitues. Comme plat principal : du veau ou du poulet avec des frites et des légumes. Et comme dessert : des fruits de toutes sortes et un gâteau au chocolat en forme de pyramide avec 5 bougies. »", "arabicNote": "كمقبلات: قُدِّمت خضروات طازجة (طماطم، خيار سلطة، وخس). كطبق رئيسي: لحم بتلو (عجل) أو دجاج مع بطاطس مقلية وخضار. وللتحلية: فواكه مشكلة وتورتة شوكولاتة على شكل هرم بـ 5 شمعات. 🥗🥩🍗🍟🍫🎂🕯️"}, {"speaker": "La mère", "text": "« Et tu as bien mangé ? »", "arabicNote": "وهل أكلت جيداً؟ 👩"}, {"speaker": "Gamal", "text": "« Bien sûr. »", "arabicNote": "بالتأكيد! (طبعاً). 👍"}], "unit2Ex1BonGroupe": [{"id": "u2_ex1_1", "question": "1. Jean et Suzanne fêtent leur mariage ....................", "options": ["a) Le 15 juin.", "b) Le 22 juin.", "c) Le 20 juin."], "correctIndex": 0, "explanation": "Le 15 juin à l'occasion de leur fête de mariage.", "arabicTranslation": "يحتفل جان وسوزان بعيد زواجهما ➔ في 15 يونيو (Le 15 juin)."}, {"id": "u2_ex1_2", "question": "2. Jean et Suzanne invitent leurs amis à dîner ....................", "options": ["c) dans un restaurant.", "a) Chez eux.", "b) à El Ahram Hebo."], "correctIndex": 0, "explanation": "Ils ont réservé une table pour 20 personnes dans un grand restaurant.", "arabicTranslation": "دعا جان وسوزان أصدقائهما للعشاء ➔ في مطعم (dans un restaurant)."}, {"id": "u2_ex1_3", "question": "3. Comme plat principal on a mangé ....................", "options": ["b) de la viande avec des légumes.", "a) des fruits et gâteaux.", "c) des concombres en salade."], "correctIndex": 0, "explanation": "Comme plat principal : du veau ou du poulet avec des frites et des légumes (de la viande avec des légumes).", "arabicTranslation": "كتصنيف للطبق الرئيسي تناولوا ➔ اللحم مع الخضار (de la viande avec des légumes)."}, {"id": "u2_ex1_4", "question": "4. Gamal a raconté la soirée ....................", "options": ["a) à son père et sa mère.", "b) aux journalistes.", "c) à ses amis."], "correctIndex": 0, "explanation": "De retour chez lui, Gamal a parlé de la soirée avec ses parents (son père et sa mère).", "arabicTranslation": "روى جمال أحداث السهرة ➔ لوالده ووالدته (à son père et sa mère)."}], "unit2Ex2VraiOuFaux": [{"id": "u2_ex2_a", "question": "a) Au dîner, il y a 20 personnes.", "options": ["Vrai (صح) ✔️", "Faux (خطأ) ❌"], "correctIndex": 0, "explanation": "Vrai : « Ils ont réservé une table pour 20 personnes ».", "arabicTranslation": "في العشاء يوجد 20 شخصاً ➔ [صح Vrai]. حجزوا طاولة لعشرين شخصاً."}, {"id": "u2_ex2_b", "question": "b) Au menu, il y a de la viande.", "options": ["Vrai (صح) ✔️", "Faux (خطأ) ❌"], "correctIndex": 0, "explanation": "Vrai : Le veau (لحم العجل) et le poulet sont de la viande.", "arabicTranslation": "في قائمة الطعام يوجد لحم ➔ [صح Vrai]. تم تقديم لحم العجل du veau والدجاج."}, {"id": "u2_ex2_c", "question": "c) De ce restaurant, on voit les Pyramides.", "options": ["Faux (خطأ) ❌", "Vrai (صح) ✔️"], "correctIndex": 0, "explanation": "Faux : Le gâteau est en forme de pyramide, mais le texte ne dit pas qu'on voit les pyramides depuis le restaurant.", "arabicTranslation": "من هذا المطعم نرى الأهرامات ➔ [خطأ Faux]. الكعكة على شكل هرم وليس المطعم يطل على الأهرامات."}, {"id": "u2_ex2_d", "question": "d) Le 5 juin, C'est la fête de mariage de Jean et sa femme.", "options": ["Faux (خطأ) ❌", "Vrai (صح) ✔️"], "correctIndex": 0, "explanation": "Faux : La fête de mariage a lieu le 15 juin (et non le 5 juin).", "arabicTranslation": "في 5 يونيو عيد زواج جان وزوجته ➔ [خطأ Faux]. التاريخ الصحيح هو 15 يونيو (Le 15 juin)."}, {"id": "u2_ex2_e", "question": "e) On a mangé un gâteau aux fruits.", "options": ["Faux (خطأ) ❌", "Vrai (صح) ✔️"], "correctIndex": 0, "explanation": "Faux : C'est « un gâteau au chocolat en forme de pyramide » (les fruits étaient à part).", "arabicTranslation": "أكلوا كعكة بالفواكه ➔ [خطأ Faux]. الكعكة كانت بالشوكولاتة (au chocolat) والفواكه قُدمت كصنف مستقل."}], "unit2Ex3RepondsPrisDuTexte": [{"id": "u2_ex3_a", "question": "a) Où travaillent les journalistes, amis de Jean ?", "options": ["À El Ahram Hebdo", "Au restaurant", "À l'hôpital"], "correctIndex": 0, "explanation": "Ils travaillent à « El Ahram Hebdo » (جريدة الأهرام إبدو).", "arabicTranslation": "أين يعمل الصحفيون أصدقاء جان؟ ➔ في جريدة الأهرام إبدو (À El Ahram Hebdo)."}, {"id": "u2_ex3_b", "question": "b) De quelle fête on parle ?", "options": ["De la fête de mariage de Jean et sa femme", "De la fête d'anniversaire", "De la fête du Nouvel An"], "correctIndex": 0, "explanation": "On parle de la fête de mariage de Jean Morelle et sa femme.", "arabicTranslation": "عن أي حفلة نتحدث؟ ➔ عن حفلة عيد زواج جان وزوجته."}, {"id": "u2_ex3_c", "question": "c) Pour quelle heure Jean a réservé la table ?", "options": ["À 22 heures (dix heures du soir)", "À 20 heures", "À 12 heures (midi)"], "correctIndex": 0, "explanation": "Jean a invité des amis à dîner à 22 heures.", "arabicTranslation": "لأي ساعة حجز جان الطاولة؟ ➔ الساعة 22:00 (العاشرة مساءً)."}, {"id": "u2_ex3_d", "question": "d) Au menu qu'est – ce qu'il y a comme crudités ?", "options": ["Des tomates, des concombres en salade et des laitues", "Des frites et des légumes", "Des fruits de toutes sortes"], "correctIndex": 0, "explanation": "Comme entrée, on a servi des crudités : des tomates, des concombres en salade et des laitues.", "arabicTranslation": "ماذا يوجد في القائمة كمقبلات سلطة خضراء؟ ➔ طماطم، خيار سلطة، وخس."}, {"id": "u2_ex3_e", "question": "e) Combien de bougies il y a sur le gâteau ?", "options": ["5 bougies (cinq bougies)", "20 bougies", "15 bougies"], "correctIndex": 0, "explanation": "Il y a un gâteau au chocolat en forme de pyramide avec 5 bougies.", "arabicTranslation": "كم شمعة توجد على الكعكة؟ ➔ 5 شمعات (5 bougies)."}], "unit2Ex4Complete": [{"id": "u2_ex4_1", "question": "1- Le 15 juin, ____________ de la fête de mariage.", "options": ["à l'Occasion", "une table", "ses parents"], "correctIndex": 0, "explanation": "Le 15 juin, à l'occasion de la fête de mariage.", "arabicTranslation": "15 يونيو، [بمناسبة] عيد الزواج ➔ à l'Occasion"}, {"id": "u2_ex4_2", "question": "2- Il a réservé ____________ pour cinq personnes.", "options": ["une table", "des crudités", "ses amis"], "correctIndex": 0, "explanation": "Il a réservé une table (dans le texte pour 20 personnes).", "arabicTranslation": "هو حجز [طاولة] ➔ une table"}, {"id": "u2_ex4_3", "question": "3- Jean et sa femme ont invité ____________ à dîner.", "options": ["ses amis", "ses parents", "une table"], "correctIndex": 0, "explanation": "Jean et sa femme ont invité ses amis à dîner.", "arabicTranslation": "جان وزوجته دعوا [أصدقاءه] للعشاء ➔ ses amis"}, {"id": "u2_ex4_4", "question": "4- Gamal a parlé de la fête avec ____________", "options": ["ses parents", "ses amis", "des crudités"], "correctIndex": 0, "explanation": "Gamal a parlé de la soirée avec ses parents.", "arabicTranslation": "تحدث جمال عن الحفلة مع [والديه] ➔ ses parents"}, {"id": "u2_ex4_5", "question": "5- Jean et Suzanne fêtent leur mariage ____________", "options": ["Le 15 juin", "à l'Occasion", "ses amis"], "correctIndex": 0, "explanation": "Jean et Suzanne fêtent leur mariage Le 15 juin.", "arabicTranslation": "جان وسوزان يحتفلان بعيد زواجهما [في 15 يونيو] ➔ Le 15 juin"}, {"id": "u2_ex4_6", "question": "6- Comme entrée, on a servi ____________", "options": ["des crudités", "une table", "Le 15 juin"], "correctIndex": 0, "explanation": "Comme entrée, on a servi des crudités (tomates, concombres, laitues).", "arabicTranslation": "كمقبلات، تم تقديم [خضروات طازجة / سلطات خضراء] ➔ des crudités"}], "unit2VocabWords": [{"id": "u2_v1", "french": "à l'occasion de", "arabic": "بمناسبة", "category": "EXPRESSION", "exampleFr": "À l'occasion de leur fête de mariage, ils ont invité des amis.", "exampleAr": "بمناسبة حفل عيد زواجهما، دعوا الأصدقاء.", "phoneticOrNote": "", "pageReference": "p. 38"}, {"id": "u2_v2", "french": "la fête de mariage", "arabic": "عيد الزواج", "category": "FEMININE", "exampleFr": "Jean et Suzanne célèbrent la fête de mariage.", "exampleAr": "جان وسوزان يحتفلان بعيد زواجهما.", "phoneticOrNote": "", "pageReference": "p. 38"}, {"id": "u2_v3", "french": "Une femme", "arabic": "زوجة / سيدة", "category": "FEMININE", "exampleFr": "Jean Morelle et sa femme ont réservé une table.", "exampleAr": "جان موريل وزوجته حجزا Ar": "في وجبة الإفطار، للشرب أتناول :", "options": ["du fromage", "du thé au lait", "de la confiture", "des œufs"], "correctIndex": 1, "explanationAr": "الشاي بالحليب (du thé au lait) من المشروبات (Je bois)، بينما الجبن والمربى والبيض أطعمة تؤكل (Je mange).", "tip": "انتبه لفعل الجملة: boire = يشرب، manger = يأكل."}, {"id": "rq_3", "questionFr": "Comme entrée au déjeuner, nous mangeons :", "questionAr": "كمقبلات في وجبة الغداء، نأكل :", "options": ["de la salade", "du poisson", "de la tarte", "des frites"], "correctIndex": 0, "explanationAr": "وفقاً لص 41: كـ entrée مقبلات نأكل (de la salade). والسمك والبطاطس طبق رئيسي (plat principal).", "tip": "Comme entrée = كمقبلات في بداية الوجبة."}, {"id": "rq_4", "questionFr": "Comme plat principal, mon père commande :", "questionAr": "كطبق رئيسي، يطلب والدي :", "options": ["de la glace", "du poulet avec du riz", "de la confiture", "du thé"], "correctIndex": 1, "explanationAr": "الطبق الرئيسي (plat principal) ص 41 يشمل: du riz, du poulet, du poisson, de la viande, des frites.", "tip": "plat principal = الطبق الرئيسي الأساسي للغداء."}, {"id": "rq_5", "questionFr": "Au dîner, je prends du yaourt, des fruits ou comme :", "questionAr": "في العشاء، أتناول زبادي وفواكه أو مثل :", "options": ["le stade", "le petit déjeuner", "la gare", "le train"], "correctIndex": 1, "explanationAr": "نص ص 42: « 3- le dîner: Je prends du yaourt, des fruits, du gâteau. Ou comme le petit déjeuner. »", "tip": "وجبة العشاء تكون خفيفة أو مثل وجبة الإفطار."}, {"id": "rq_6", "questionFr": "Comme dessert, Suzanne adore prendre :", "questionAr": "كحلوى بعد الأكل، تعشق سوزان تناول :", "options": ["des fèves", "du beurre", "de la glace", "du pain"], "correctIndex": 2, "explanationAr": "الحلويات (Les desserts) المقررة ص 42 هي: du gâteau, de la tarte, de la glace, des fruits.", "tip": "de la glace = مثلجات / آيس كريم (مفرد مؤنث)."}, {"id": "rq_7", "questionFr": "Je bois toujours ..... eau fraîche à midi.", "questionAr": "أنا أشرب دائماً ..... ماء عذباً ظهراً.", "options": ["du", "de la", "de l'", "des"], "correctIndex": 2, "explanationAr": "كلمة eau تبدأ بحرف متحرك (e)، فتأخذ أداة التجزئة (de l').", "tip": "الاسم المفرد الذي يبدأ بحرف متحرك يأخذ دائماً (de l')."}, {"id": "rq_8", "questionFr": "Le matin, les Égyptiens mangent souvent ..... fèves.", "questionAr": "في الصباح، يأكل المصريون غالباً ..... فول.", "options": ["du", "de la", "des", "de l'"], "correctIndex": 2, "explanationAr": "كلمة fèves جمع تنتهي بـ s، لذا تأخذ أداة التجزئة للجمع (des).", "tip": "des fèves = الفول (جمع)."}, {"id": "rq_9", "questionFr": "Je mange ..... tartine beurrée pour le petit déjeuner.", "questionAr": "آكل ..... شريحة خبز بالزبدة في الإفطار.", "options": ["du", "de la", "de l'", "des"], "correctIndex": 1, "explanationAr": "كلمة tartine مفرد مؤنث في الفرنسية، لذا تأخذ أداة التجزئة (de la).", "tip": "de la tartine = شريحة خبز مدهونة (مؤنث)."}, {"id": "rq_10", "questionFr": "Le soir, mon frère prend ..... yaourt nature.", "questionAr": "في المساء، يتناول أخي ..... زبادي طبيعي.", "options": ["du", "de l'", "de la", "des"], "correctIndex": 0, "explanationAr": "انتبه جيداً: كلمة yaourt مفرد مذكر في الفرنسية ولا تعامل كحرف متحرك مع التجزئة بل تأخذ (du yaourt).", "tip": "قاعدة ذهبية: du yaourt (مذكر بأداة du)."}], "unit3FullText": "Unité 3 : Santé / Hôpital. Samir, l'ami de Gamal a eu un accident dans la rue. L'ambulance l'a vite transporté à l'hôpital. Gamal et Ali sont allés le voir. Dans sa chambre à l'hôpital, Samir était couché. Il avait l'air fatigué et il parlait difficilement. Gamal : Ça va bien maintenant ? Samir : Oui, merci. Gamal : Qu'est-ce qui est arrivé ? Samir : Une voiture m'a renversé et je suis tombé. À ce moment, le médecin et l'infirmière sont entrés. Le médecin : Ça va aujourd'hui ? Samir : Oui docteur, mais j'ai encore mal au bras et à la jambe. Le médecin l'a examiné, il a lu la radiographie et le rapport et lui a dit : Ne t'inquiète pas, repose-toi bien, et prends tes médicaments. Je te conseille de prendre encore ce calmant. Tu peux marcher dans quelques jours. Quand le médecin est sorti, Gamal et Ali ont salué leur ami et sont rentrés chez eux.", "unit3FullTextArabic": "الوحدة الثالثة : الصحة والمستشفى. سمير، صديق جمال، تعرض لحادث في الشارع. ونقلته سيارة الإسعاف سريعاً إلى المستشفى. ذهب جمال وعلي لزيارته. في غرفته بالمستشفى، كان سمير مستلقياً على السرير. كان يبدو عليه التعب وكان يتحدث بصعوبة. جمال: هل أنت بخير الآن؟ سمير: نعم، شكراً. جمال: ماذا حدث؟ سمير: صدمتني سيارة وسقطت أرضاً. في هذه اللحظة، دخل الطبيب والممرضة. الطبيب: كيف حالك اليوم؟ سمير: نعم يا دكتور، لكن ما زال ذراعي وساقي يؤلماني. فحصه الطبيب، وقرأ الأشعة والتقرير الطبي وقال له: «لا تقلق، استرح جيداً، وتناول أدويتك. أنصحك أيضاً بأخذ هذا المسكن. يمكنك المشي خلال بضعة أيام». وعندما خرج الطبيب، ودع جمال وعلي صديقهما وعادا إلى منزليهما.", "unit3Page59Text": "Samir, l'ami de Gamal a eu un accident dans la rue. L'ambulance l'a vite transporté à l'hôpital. Gamal et Ali sont allés le voir. Dans sa chambre à l'hôpital, Samir était couché. Il avait l'air fatigué et il parlait difficilement.\n- Gamal : Ça va bien maintenant?\n- Samir : Oui, merci.\n- Gamal : Qu'est-ce qui est arrivé?\n- Samir : Une voiture m'a renversé et je suis tombé.", "unit3Page59TextArabic": "سمير، صديق جمال، تعرض لحادث في الشارع. نقلته سيارة الإسعاف سريعاً إلى المستشفى. ذهب جمال وعلي لزيارته. في غرفته بالمستشفى، كان سمير مستلقياً على السرير. كان يبدو متعباً ويتحدث بصعوبة.\n- جمال: هل أنت بخير الآن؟\n- سمير: نعم، شكراً.\n- جمال: ماذا حدث؟\n- سمير: صدمتني سيارة وسقطت أرضاً.", "unit3Page60Text": "À ce moment, le médecin et l'infirmière sont entrés.\n- Le médecin : Ça va aujourd'hui?\n- Samir : Oui docteur, mais j'ai encore mal au bras et à la jambe.\nLe médecin l'a examiné, il a lu la radiographie et le rapport et lui a dit:\n\" Ne t'inquiète pas, repose-toi bien, et prends tes médicaments. Je te conseille de prendre encore ce calmant. Tu peux marcher dans quelques jours\".\nQuand le médecin est sorti, Gamal et Ali ont salué leur ami et sont rentrés chez eux.", "unit3Page60TextArabic": "في هذه اللحظة، دخل الطبيب والممرضة.\n- الطبيب: كيف حالك اليوم؟\n- سمير: نعم يا دكتور، لكن ما زال يؤلمني ذراعي وساقي.\nفحصه الطبيب، وقرأ الأشعة والتقرير الطبي وقال له:\n\"لا تقلق، استرح جيداً، وتناول أدويتك. أنصحك أيضاً بتناول هذا المسكن. يمكنك المشي بعد بضعة أيام\".\nوعندما خرج الطبيب، سلّم جمال وعلي على صديقهما وعادا إلى منزليهما.", "unit3Dialogues": [{"speaker": "Récit (ص 59)", "text": "« Samir, l'ami de Gamal a eu un accident dans la rue. L'ambulance l'a vite transporté à l'hôpital. Gamal et Ali sont allés le voir. Dans sa chambre à l'hôpital, Samir était couché. Il avait l'air fatigué et il parlait difficilement. »", "arabicNote": "سمير صديق جمال تعرض لحادث في الشارع. نقلته سيارة الإسعاف سريعاً للمستشفى. ذهب جمال وعلي لزيارته. كان مستلقياً في غرفته يبدو متعباً ويتكلم بصعوبة. 🚑"}, {"speaker": "Gamal", "text": "« Ça va bien maintenant? »", "arabicNote": "هل أنت على ما يرام الآن؟ 🤝"}, {"speaker": "Samir", "text": "« Oui, merci. »", "arabicNote": "نعم، شكراً. 🛌"}, {"speaker": "Gamal", "text": "« Qu'est-ce qui est arrivé? »", "arabicNote": "ماذا حدث؟ (كيف وقع الحادث؟) ❓"}, {"speaker": "Samir", "text": "« Une voiture m'a renversé et je suis tombé. »", "arabicNote": "صدمتني سيارة وسقطت أرضاً. 🚗💥"}, {"speaker": "Récit (ص 60)", "text": "« À ce moment, le médecin et l'infirmière sont entrés. »", "arabicNote": "في هذه اللحظة، دخل الطبيب والممرضة إلى الغرفة. 👨‍⚕️👩‍⚕️"}, {"speaker": "Le médecin", "text": "« Ça va aujourd'hui? »", "arabicNote": "كيف حالك اليوم؟ 🩺"}, {"speaker": "Samir", "text": "« Oui docteur, mais j'ai encore mal au bras et à la jambe. »", "arabicNote": "نعم يا دكتور، لكن لا يزال ذراعي وساقي يؤلماني. 🤕"}, {"speaker": "Le médecin (نصائح الطبيب)", "text": "« Ne t'inquiète pas, repose-toi bien, et prends tes médicaments. Je te conseille de prendre encore ce calmant. Tu peux marcher dans quelques jours. »", "arabicNote": "لا تقلق، استرح جيداً، وتناول أدويتك. أنصحك بأخذ هذا المسكن مجدداً. يمكنك المشي خلال بضعة أيام. 💊"}, {"speaker": "Récit (خاتمة الزيارة)", "text": "« Quand le médecin est sorti, Gamal et Ali ont salué leur ami et sont rentrés chez eux. »", "arabicNote": "وعندما خرج الطبيب، ودع جمال وعلي صديقهما وعادا إلى منزليهما. 👋🏠"}], "unit3Ex1VraiOuFaux": [{"id": "u3_vf_1", "question": "1. Ali et Gamal sont allés voir Samir chez lui.", "options": ["Faux (خطأ) ❌", "Vrai (صح) ✔️"], "correctIndex": 0, "explanation": "Faux : Ils sont allés le voir à l'hôpital (dans sa chambre à l'hôpital).", "arabicTranslation": "علي وجمال ذهبا لرؤية سمير في بيته ➔ [خطأ Faux]. ذهبا لزيارته في المستشفى وليس في بيته."}, {"id": "u3_vf_2", "question": "2. Le médecin a parlé à Samir.", "options": ["Vrai (صح) ✔️", "Faux (خطأ) ❌"], "correctIndex": 0, "explanation": "Vrai : Le médecin a parlé à Samir : « Ça va aujourd'hui? » et lui a donné des conseils.", "arabicTranslation": "تحدث الطبيب إلى سمير ➔ [صح Vrai]. سأله عن حاله وقدم له النصائح الطبية."}, {"id": "u3_vf_3", "question": "3. Le médecin a donné à Samir quelques conseils.", "options": ["Vrai (صح) ✔️", "Faux (خطأ) ❌"], "correctIndex": 0, "explanation": "Vrai : Le médecin lui a dit : « Ne t'inquiète pas, repose-toi bien, et prends tes médicaments. Je te conseille... ».", "arabicTranslation": "أعطى الطبيب لسمير بعض النصائح ➔ [صح Vrai]. نصحه بالراحة وتناول الدواء والمسكن."}, {"id": "u3_vf_4", "question": "4. L'infirmière a examiné le malade.", "options": ["Faux (خطأ) ❌", "Vrai (صح) ✔️"], "correctIndex": 0, "explanation": "Faux : C'est le médecin qui a examiné le malade (« Le médecin l'a examiné »).", "arabicTranslation": "الممرضة فحصت المريض ➔ [خطأ Faux]. الطبيب هو الذي فحصه وقرأ التقرير والأشعة."}], "unit3Ex2QuestionsReponses": [{"id": "u3_q_1", "question": "1. Où est Samir ?", "options": ["À l'hôpital (dans sa chambre)", "Chez lui à la maison", "Au club de sport", "À l'école"], "correctIndex": 0, "explanation": "Samir est à l'hôpital (dans sa chambre à l'hôpital).", "arabicTranslation": "أين يكون سمير؟ ➔ في المستشفى (في غرفته بالمستشفى)."}, {"id": "u3_q_2", "question": "2. Pourquoi l'ambulance l'a transporté ?", "options": ["Parce qu'il a eu un accident dans la rue (une voiture l'a renversé)", "Pour visiter un ami malade", "Pour acheter des médicaments", "Pour passer les vacances"], "correctIndex": 0, "explanation": "L'ambulance l'a transporté à l'hôpital parce qu'il a eu un accident dans la rue (une voiture l'a renversé).", "arabicTranslation": "لماذا نقلته سيارة الإسعاف؟ ➔ لأنه تعرض لحادث في الشارع (صدمته سيارة)."}, {"id": "u3_q_3", "question": "3. Où a-t-il mal ?", "options": ["Au bras et à la jambe", "À la tête et aux yeux", "Au ventre et au dos", "Aux dents et à la gorge"], "correctIndex": 0, "explanation": "Il a encore mal au bras et à la jambe.", "arabicTranslation": "أين يشعر بالألم؟ ➔ في ذراعه وساقه (au bras et à la jambe)."}, {"id": "u3_q_4", "question": "4. Que fait le médecin ?", "options": ["Il examine le malade, lit la radiographie et lui donne des conseils", "Il prépare le repas du malade", "Il conduit l'ambulance", "Il salue Samir et rentre chez lui"], "correctIndex": 0, "explanation": "Le médecin l'a examiné, il a lu la radiographie et le rapport et lui a donné des conseils.", "arabicTranslation": "ماذا يفعل الطبيب؟ ➔ فحص المريض، وقرأ الأشعة والتقرير الطبي وقدم له النصائح."}], "bodyPainQuestions": [{"id": "u3_p1", "question": "1. J'ai mal ______ tête.", "options": ["au", "à la", "aux", "à l'"], "correctIndex": 1, "explanation": "tête est féminin singulier ➔ à la tête.", "arabicTranslation": "أشعر بألم في الرأس. (الرأس tête مؤنث ➔ نختار à la)"}, {"id": "u3_p2", "question": "2. Sami a mal ______ pieds.", "options": ["au", "à la", "aux", "à l'"], "correctIndex": 2, "explanation": "pieds est au pluriel ➔ aux pieds.", "arabicTranslation": "سامي يشعر بألم في القدمين. (القدمين pieds جمع ➔ نختار aux)"}, {"id": "u3_p3", "question": "3. Ma mère a mal ______ ventre.", "options": ["au", "à la", "aux", "à l'"], "correctIndex": 0, "explanation": "ventre est masculin singulier ➔ au ventre.", "arabicTranslation": "أمي تشعر بألم في البطن. (البطن ventre مذكر ➔ نختار au)"}, {"id": "u3_p4", "question": "4. Nous avons mal ______ estomac.", "options": ["au", "à la", "aux", "à l'"], "correctIndex": 3, "explanation": "estomac commence par une voyelle ➔ à l'estomac.", "arabicTranslation": "نشعر بألم في المعدة. (المعدة estomac تبدأ بحرف متحرك ➔ نختار à l')"}, {"id": "u3_p5", "question": "5. Farida a mal ______ yeux.", "options": ["au", "à la", "aux", "à l'"], "correctIndex": 2, "explanation": "yeux est au pluriel ➔ aux yeux.", "arabicTranslation": "فريدة تشعر بألم في العينين. (العينين yeux جمع ➔ نختار aux)"}], "medicalSituations": [{"id": "u3_med1", "question": "1. Tu as très mal au bras, le médecin te dit :", "options": ["Fais tes devoirs !", "Fais une radiographie.", "Mange une glace !"], "correctIndex": 1, "explanation": "Pour un bras blessé, on fait une radiographie.", "arabicTranslation": "ذراعك يؤلمك بشدة، الطبيب يقول لك : (اعمل واجباتك! / قم بعمل أشعة. / تناول آيس كريم!)"}, {"id": "u3_med2", "question": "2. Ton ami te demande ce que l'ambulancier fait :", "options": ["Il transporte les malades.", "Il examine les dents.", "Il enseigne la leçon."], "correctIndex": 0, "explanation": "L'ambulancier transporte les personnes malades ou blessées.", "arabicTranslation": "صديقك يسألك عما يفعله المسعف : (ينقل المرضى. / يفحص الأسنان. / يشرح الدرس.)"}, {"id": "u3_med3", "question": "3. Le médecin donne un conseil à Samir :", "options": ["Va au cinéma !", "Repose-toi bien et prends tes médicaments.", "Fais attention au feu !"], "correctIndex": 1, "explanation": "Conseil du médecin : du repos et les médicaments à l'heure.", "arabicTranslation": "الطبيب يقدم نصيحة لسمير : (اذهب إلى السينما! / ارتح جيداً وتناول أدويتك في موعدها. / انتبه للنار!)"}], "revisionEx1MetsAuPresent": [{"id": "rev_ex1_1", "question": "1- J' ______ un livre. (avoir)", "options": ["ai", "as", "a"], "correctIndex": 0, "explanation": "Verbe avoir avec J' ➔ J'ai.", "arabicTranslation": "تصريف فعل يملك avoir مع الضمير J' ➔ J'ai un livre (أنا أملك كتاباً)."}, {"id": "rev_ex1_2", "question": "2- Tu ______ content. (être)", "options": ["es", "suis", "est"], "correctIndex": 0, "explanation": "Verbe être avec Tu ➔ Tu es.", "arabicTranslation": "تصريف فعل الكينونة être مع الضمير Tu ➔ Tu es content (أنت سعيد)."}, {"id": "rev_ex1_3", "question": "3- Je ______ aux élèves. (parler)", "options": ["parle", "parles", "parlons"], "correctIndex": 0, "explanation": "Verbe parler (1er groupe) avec Je ➔ Je parle.", "arabicTranslation": "تصريف فعل يتحدث parler (مجموعة أولى) مع Je ➔ Je parle (أنا أتحدث إلى التلاميذ)."}, {"id": "rev_ex1_4", "question": "4- Nous ______ des gâteaux. (manger)", "options": ["mangeons", "mangons", "mangez"], "correctIndex": 0, "explanation": "Verbe manger avec Nous ➔ Nous mangeons (on ajoute 'e' pour la prononciation).", "arabicTranslation": "تصريف فعل يأكل manger مع Nous: نضيف حرف e قبل ons للحفاظ على النطق ➔ Nous mangeons (نحن نأكل كعكاً)."}, {"id": "rev_ex1_5", "question": "5- Vous ______ la télé. (regarder)", "options": ["regardez", "regardons", "regardent"], "correctIndex": 0, "explanation": "Verbe regarder avec Vous ➔ Vous regardez.", "arabicTranslation": "تصريف فعل يشاهد regarder مع Vous ➔ Vous regardez la télé (أنتم تشاهدون التلفاز)."}, {"id": "rev_ex1_6", "question": "6- Héba ______ au ballon. (jouer)", "options": ["joue", "joues", "jouent"], "correctIndex": 0, "explanation": "Héba (elle) avec verbe jouer ➔ joue.", "arabicTranslation": "هبة (مفرد مؤنث elle) مع فعل يلعب jouer ➔ Héba joue au ballon (هبة تلعب بالكرة)."}, {"id": "rev_ex1_7", "question": "7- Je ______ le devoir. (finir)", "options": ["finis", "finit", "finissons"], "correctIndex": 0, "explanation": "Verbe finir (2ème groupe) avec Je ➔ Je finis.", "arabicTranslation": "تصريف فعل ينهي finir (مجموعة ثانية) مع Je ➔ Je finis le devoir (أنا أنهي الواجب)."}, {"id": "rev_ex1_8", "question": "8- Ils ______ 16 ans. (avoir)", "options": ["ont", "sont", "avons"], "correctIndex": 0, "explanation": "Verbe avoir pour l'âge avec Ils ➔ Ils ont.", "arabicTranslation": "تصريف فعل يملك avoir للعمر مع الجمع Ils ➔ Ils ont 16 ans (هم عندهم 16 سنة)."}, {"id": "rev_ex1_9", "question": "9- Nous ______ des filles. (être)", "options": ["sommes", "sont", "êtes"], "correctIndex": 0, "explanation": "Verbe être avec Nous ➔ Nous sommes.", "arabicTranslation": "تصريف فعل الكينونة être مع Nous ➔ Nous sommes des filles (نحن فتيات)."}, {"id": "rev_ex1_10", "question": "10- Ali ______ la chanson. (écouter)", "options": ["écoute", "écoutes", "écoutent"], "correctIndex": 0, "explanation": "Ali (il) avec verbe écouter ➔ écoute.", "arabicTranslation": "علي (مفرد مذكر il) مع فعل يستمع écouter ➔ Ali écoute la chanson (علي يستمع للأغنية)."}], "revisionEx2ChoisisBonneReponse": [{"id": "rev_ex2_1", "question": "1. Maintenant, le professeur ______ la leçon.", "options": ["explique", "expliquez", "expliques"], "correctIndex": 0, "explanation": "Le professeur (il) explique.", "arabicTranslation": "الآن، المعلم (il) يشرح الدرس ➔ le professeur explique la leçon."}, {"id": "rev_ex2_2", "question": "2. Aujourd'hui, nous ______ au stade.", "options": ["allons", "aller", "allez"], "correctIndex": 0, "explanation": "Verbe aller avec nous ➔ nous allons.", "arabicTranslation": "اليوم، نحن نذهب إلى الاستاد ➔ nous allons au stade."}, {"id": "rev_ex2_3", "question": "3. Chaque jour, ils ______ leurs devoirs.", "options": ["finissent", "finis", "finissons"], "correctIndex": 0, "explanation": "Verbe finir (2ème groupe) avec ils ➔ ils finissent.", "arabicTranslation": "كل يوم، هم ينهون واجباتهم (ils + finir ➔ finissent) ➔ ils finissent."}, {"id": "rev_ex2_4", "question": "4. Chaque matin, je ______ prendre le petit déjeuner tôt.", "options": ["préfère", "préfères", "préférez"], "correctIndex": 0, "explanation": "Verbe préférer avec je ➔ je préfère.", "arabicTranslation": "كل صباح، أنا أفضل تناول الإفطار مبكراً (je + préférer ➔ préfère) ➔ je préfère."}, {"id": "rev_ex2_5", "question": "5. Nous ______ les fruits.", "options": ["aimons", "aimes", "aimez"], "correctIndex": 0, "explanation": "Verbe aimer avec nous ➔ nous aimons.", "arabicTranslation": "نحن نحب الفواكه (nous + aimer ➔ aimons) ➔ nous aimons."}], "revisionEx3Interrogatifs": [{"id": "rev_ex3_1", "question": "1) ______ allez-vous ?\n— ça va bien merci.", "options": ["Comment", "Qui", "Où", "Que", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'état de santé par 'Comment' ➔ Comment allez-vous ?", "arabicTranslation": "كيف حالكم؟ السؤال عن الحال والصحة بـ Comment ➔ Comment allez-vous ? (كيف حالكم؟ - بخير شكراً)."}, {"id": "rev_ex3_2", "question": "2) ______ tu as ?\n— J'ai un examen.", "options": ["Qu'est ce que", "Comment", "Qui", "Où", "Que"], "correctIndex": 0, "explanation": "On demande ce qu'on a par 'Qu'est ce que' ➔ Qu'est ce que tu as ?", "arabicTranslation": "ماذا عندك؟ السؤال عن غير عاقل بـ Qu'est ce que tu as ? (ماذا عندك؟ - عندي امتحان)."}, {"id": "rev_ex3_3", "question": "3) ______ c'est ?\n— C'est la maitresse de français.", "options": ["Qui", "Où", "Que", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'identité d'une personne par 'Qui' ➔ Qui c'est ?", "arabicTranslation": "من هذا؟ السؤال عن شخص عاقل بـ Qui c'est? (من هذا؟ - إنها معلمة اللغة الفرنسية)."}, {"id": "rev_ex3_4", "question": "4) ______ sont les élèves ?\n— Les élèves sont dans la cour.", "options": ["Où", "Qui", "Que", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande le lieu (dans la cour) par 'Où' ➔ Où sont les élèves ?", "arabicTranslation": "أين التلاميذ؟ السؤال عن المكان (dans la cour في الفناء) بـ Où ➔ Où sont les élèves ?"}, {"id": "rev_ex3_5", "question": "5) ______ fais-tu ?\n— J'écoute de la musique.", "options": ["Que", "Qui", "Où", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'action par 'Que' avec inversion ➔ Que fais-tu ?", "arabicTranslation": "ماذا تفعل؟ السؤال عن الفعل مع تقديم الفعل على الفاعل بـ Que ➔ Que fais-tu ? (ماذا تفعل؟ - أستمع للموسيقى)."}], "revisionEx4ArticlesLieux": [{"id": "rev_ex4_1", "question": "1) ______ pharmacie", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Pharmacie est féminin singulier ➔ à la pharmacie.", "arabicTranslation": "الصيدلية مكان مؤنث مفرد ➔ à la pharmacie."}, {"id": "rev_ex4_2", "question": "2) ______ école", "options": ["à l'", "à la", "au", "aux", "à"], "correctIndex": 0, "explanation": "École commence par une voyelle ➔ à l'école.", "arabicTranslation": "المدرسة تبدأ بحرف متحرك é ➔ à l'école."}, {"id": "rev_ex4_3", "question": "3) ______ restaurant", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Restaurant est masculin singulier ➔ au restaurant.", "arabicTranslation": "المطعم مكان مذكر مفرد ➔ au restaurant."}, {"id": "rev_ex4_4", "question": "4) ______ zoo", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Zoo est masculin singulier ➔ au zoo.", "arabicTranslation": "حديقة الحيوان مكان مذكر مفرد ➔ au zoo."}, {"id": "rev_ex4_5", "question": "5) ______ tour", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Tour (البرج) est féminin singulier ➔ à la tour.", "arabicTranslation": "البرج مكان مؤنث مفرد ➔ à la tour."}, {"id": "rev_ex4_6", "question": "6) ______ poste", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Poste (مكتب البريد) est féminin singulier ➔ à la poste.", "arabicTranslation": "مكتب البريد مكان مؤنث مفرد ➔ à la poste."}, {"id": "rev_ex4_7", "question": "7) ______ cinéma", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Cinéma est masculin singulier ➔ au cinéma.", "arabicTranslation": "السينما مكان مذكر مفرد ➔ au cinéma."}, {"id": "rev_ex4_8", "question": "8) ______ hôtel", "options": ["à l'", "au", "à la", "aux", "à"], "correctIndex": 0, "explanation": "Hôtel commence par 'h' muet (voyelle) ➔ à l'hôtel.", "arabicTranslation": "الفندق يبدأ بحرف h صامت ➔ à l'hôtel."}, {"id": "rev_ex4_9", "question": "9) ______ club", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Club est masculin singulier ➔ au club.", "arabicTranslation": "النادي مكان مذكر مفرد ➔ au club."}, {"id": "rev_ex4_10", "question": "10) ______ pyramides", "options": ["aux", "au", "à la", "à l'", "à"], "correctIndex": 0, "explanation": "Pyramides est au pluriel (-s) ➔ aux pyramides.", "arabicTranslation": "الأهرامات جمع ينتهي بـ s ➔ aux pyramides."}, {"id": "rev_ex4_11", "question": "11) ______ jardin", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Jardin est masculin singulier ➔ au jardin.", "arabicTranslation": "الحديقة مكان مذكر مفرد ➔ au jardin."}, {"id": "rev_ex4_12", "question": "12) ______ magasin", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Magasin est masculin singulier ➔ au magasin.", "arabicTranslation": "المتجر مكان مذكر مفرد ➔ au magasin."}], "revisionEx5Negation": [{"id": "rev_ex5_1", "question": "1. « Nous avons des amis. »\n➔ À la forme négative :", "options": ["Nous n'avons pas d'amis.", "Nous n'avons pas des amis.", "Nous ne avons pas d'amis."], "correctIndex": 0, "explanation": "L'article 'des' se transforme en 'd'' devant voyelle ➔ d'amis.", "arabicTranslation": "أداة الجمع des تتحول في النفي إلى d' أمام حرف متحرك a ➔ Nous n'avons pas d'amis."}, {"id": "rev_ex5_2", "question": "2. « Je vais au stade. »\n➔ À la forme négative :", "options": ["Je ne vais pas au stade.", "Je ne va pas au stade.", "Je n'ai pas au stade."], "correctIndex": 0, "explanation": "Négation simple : ne + verbe + pas ➔ Je ne vais pas.", "arabicTranslation": "نفي بسيط بحصر الفعل vais بين ne و pas ➔ Je ne vais pas au stade."}, {"id": "rev_ex5_3", "question": "3. « Nous sommes des amis. »\n➔ À la forme négative :", "options": ["Nous ne sommes pas des amis.", "Nous ne sommes pas d'amis.", "Nous n'avons pas des amis."], "correctIndex": 0, "explanation": "Attention : Avec le verbe ÊTRE, l'article 'des' NE change PAS !", "arabicTranslation": "⚠️ انتبه: مع فعل الكينونة être لا تتغير des بل تظل كما هي ➔ Nous ne sommes pas des amis."}, {"id": "rev_ex5_4", "question": "4. « Il a une nouvelle voiture. »\n➔ À la forme négative :", "options": ["Il n'a pas de nouvelle voiture.", "Il n'a pas une nouvelle voiture.", "Il ne a pas de nouvelle voiture."], "correctIndex": 0, "explanation": "L'article 'une' se transforme en 'de' à la négation.", "arabicTranslation": "تتحول أداة النكرة une في النفي إلى de ➔ Il n'a pas de nouvelle voiture."}, {"id": "rev_ex5_5", "question": "5. « Elle est une élève. »\n➔ À la forme négative :", "options": ["Elle n'est pas une élève.", "Elle n'est pas d'élève.", "Elle n'est pas de élève."], "correctIndex": 0, "explanation": "Attention : Avec le verbe ÊTRE, on conserve 'une' !", "arabicTranslation": "⚠️ انتبه: مع فعل الكينونة être تبقى أداة النكرة une كما هي بدون تغيير ➔ Elle n'est pas une élève."}], "grammarQuizQuestions": [{"id": "rev_ex1_1", "question": "1- J' ______ un livre. (avoir)", "options": ["ai", "as", "a"], "correctIndex": 0, "explanation": "Verbe avoir avec J' ➔ J'ai.", "arabicTranslation": "تصريف فعل يملك avoir مع الضمير J' ➔ J'ai un livre (أنا أملك كتاباً)."}, {"id": "rev_ex1_2", "question": "2- Tu ______ content. (être)", "options": ["es", "suis", "est"], "correctIndex": 0, "explanation": "Verbe être avec Tu ➔ Tu es.", "arabicTranslation": "تصريف فعل الكينونة être مع الضمير Tu ➔ Tu es content (أنت سعيد)."}, {"id": "rev_ex1_3", "question": "3- Je ______ aux élèves. (parler)", "options": ["parle", "parles", "parlons"], "correctIndex": 0, "explanation": "Verbe parler (1er groupe) avec Je ➔ Je parle.", "arabicTranslation": "تصريف فعل يتحدث parler (مجموعة أولى) مع Je ➔ Je parle (أنا أتحدث إلى التلاميذ)."}, {"id": "rev_ex1_4", "question": "4- Nous ______ des gâteaux. (manger)", "options": ["mangeons", "mangons", "mangez"], "correctIndex": 0, "explanation": "Verbe manger avec Nous ➔ Nous mangeons (on ajoute 'e' pour la prononciation).", "arabicTranslation": "تصريف فعل يأكل manger مع Nous: نضيف حرف e قبل ons للحفاظ على النطق ➔ Nous mangeons (نحن نأكل كعكاً)."}, {"id": "rev_ex1_5", "question": "5- Vous ______ la télé. (regarder)", "options": ["regardez", "regardons", "regardent"], "correctIndex": 0, "explanation": "Verbe regarder avec Vous ➔ Vous regardez.", "arabicTranslation": "تصريف فعل يشاهد regarder مع Vous ➔ Vous regardez la télé (أنتم تشاهدون التلفاز)."}, {"id": "rev_ex1_6", "question": "6- Héba ______ au ballon. (jouer)", "options": ["joue", "joues", "jouent"], "correctIndex": 0, "explanation": "Héba (elle) avec verbe jouer ➔ joue.", "arabicTranslation": "هبة (مفرد مؤنث elle) مع فعل يلعب jouer ➔ Héba joue au ballon (هبة تلعب بالكرة)."}, {"id": "rev_ex1_7", "question": "7- Je ______ le devoir. (finir)", "options": ["finis", "finit", "finissons"], "correctIndex": 0, "explanation": "Verbe finir (2ème groupe) avec Je ➔ Je finis.", "arabicTranslation": "تصريف فعل ينهي finir (مجموعة ثانية) مع Je ➔ Je finis le devoir (أنا أنهي الواجب)."}, {"id": "rev_ex1_8", "question": "8- Ils ______ 16 ans. (avoir)", "options": ["ont", "sont", "avons"], "correctIndex": 0, "explanation": "Verbe avoir pour l'âge avec Ils ➔ Ils ont.", "arabicTranslation": "تصريف فعل يملك avoir للعمر مع الجمع Ils ➔ Ils ont 16 ans (هم عندهم 16 سنة)."}, {"id": "rev_ex1_9", "question": "9- Nous ______ des filles. (être)", "options": ["sommes", "sont", "êtes"], "correctIndex": 0, "explanation": "Verbe être avec Nous ➔ Nous sommes.", "arabicTranslation": "تصريف فعل الكينونة être مع Nous ➔ Nous sommes des filles (نحن فتيات)."}, {"id": "rev_ex1_10", "question": "10- Ali ______ la chanson. (écouter)", "options": ["écoute", "écoutes", "écoutent"], "correctIndex": 0, "explanation": "Ali (il) avec verbe écouter ➔ écoute.", "arabicTranslation": "علي (مفرد مذكر il) مع فعل يستمع écouter ➔ Ali écoute la chanson (علي يستمع للأغنية)."}, {"id": "rev_ex2_1", "question": "1. Maintenant, le professeur ______ la leçon.", "options": ["explique", "expliquez", "expliques"], "correctIndex": 0, "explanation": "Le professeur (il) explique.", "arabicTranslation": "الآن، المعلم (il) يشرح الدرس ➔ le professeur explique la leçon."}, {"id": "rev_ex2_2", "question": "2. Aujourd'hui, nous ______ au stade.", "options": ["allons", "aller", "allez"], "correctIndex": 0, "explanation": "Verbe aller avec nous ➔ nous allons.", "arabicTranslation": "اليوم، نحن نذهب إلى الاستاد ➔ nous allons au stade."}, {"id": "rev_ex2_3", "question": "3. Chaque jour, ils ______ leurs devoirs.", "options": ["finissent", "finis", "finissons"], "correctIndex": 0, "explanation": "Verbe finir (2ème groupe) avec ils ➔ ils finissent.", "arabicTranslation": "كل يوم، هم ينهون واجباتهم (ils + finir ➔ finissent) ➔ ils finissent."}, {"id": "rev_ex2_4", "question": "4. Chaque matin, je ______ prendre le petit déjeuner tôt.", "options": ["préfère", "préfères", "préférez"], "correctIndex": 0, "explanation": "Verbe préférer avec je ➔ je préfère.", "arabicTranslation": "كل صباح، أنا أفضل تناول الإفطار مبكراً (je + préférer ➔ préfère) ➔ je préfère."}, {"id": "rev_ex2_5", "question": "5. Nous ______ les fruits.", "options": ["aimons", "aimes", "aimez"], "correctIndex": 0, "explanation": "Verbe aimer avec nous ➔ nous aimons.", "arabicTranslation": "نحن نحب الفواكه (nous + aimer ➔ aimons) ➔ nous aimons."}, {"id": "rev_ex3_1", "question": "1) ______ allez-vous ?\n— ça va bien merci.", "options": ["Comment", "Qui", "Où", "Que", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'état de santé par 'Comment' ➔ Comment allez-vous ?", "arabicTranslation": "كيف حالكم؟ السؤال عن الحال والصحة بـ Comment ➔ Comment allez-vous ? (كيف حالكم؟ - بخير شكراً)."}, {"id": "rev_ex3_2", "question": "2) ______ tu as ?\n— J'ai un examen.", "options": ["Qu'est ce que", "Comment", "Qui", "Où", "Que"], "correctIndex": 0, "explanation": "On demande ce qu'on a par 'Qu'est ce que' ➔ Qu'est ce que tu as ?", "arabicTranslation": "ماذا عندك؟ السؤال عن غير عاقل بـ Qu'est ce que tu as ? (ماذا عندك؟ - عندي امتحان)."}, {"id": "rev_ex3_3", "question": "3) ______ c'est ?\n— C'est la maitresse de français.", "options": ["Qui", "Où", "Que", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'identité d'une personne par 'Qui' ➔ Qui c'est ?", "arabicTranslation": "من هذا؟ السؤال عن شخص عاقل بـ Qui c'est? (من هذا؟ - إنها معلمة اللغة الفرنسية)."}, {"id": "rev_ex3_4", "question": "4) ______ sont les élèves ?\n— Les élèves sont dans la cour.", "options": ["Où", "Qui", "Que", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande le lieu (dans la cour) par 'Où' ➔ Où sont les élèves ?", "arabicTranslation": "أين التلاميذ؟ السؤال عن المكان (dans la cour في الفناء) بـ Où ➔ Où sont les élèves ?"}, {"id": "rev_ex3_5", "question": "5) ______ fais-tu ?\n— J'écoute de la musique.", "options": ["Que", "Qui", "Où", "Comment", "Qu'est ce que"], "correctIndex": 0, "explanation": "On demande l'action par 'Que' avec inversion ➔ Que fais-tu ?", "arabicTranslation": "ماذا تفعل؟ السؤال عن الفعل مع تقديم الفعل على الفاعل بـ Que ➔ Que fais-tu ? (ماذا تفعل؟ - أستمع للموسيقى)."}, {"id": "rev_ex4_1", "question": "1) ______ pharmacie", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Pharmacie est féminin singulier ➔ à la pharmacie.", "arabicTranslation": "الصيدلية مكان مؤنث مفرد ➔ à la pharmacie."}, {"id": "rev_ex4_2", "question": "2) ______ école", "options": ["à l'", "à la", "au", "aux", "à"], "correctIndex": 0, "explanation": "École commence par une voyelle ➔ à l'école.", "arabicTranslation": "المدرسة تبدأ بحرف متحرك é ➔ à l'école."}, {"id": "rev_ex4_3", "question": "3) ______ restaurant", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Restaurant est masculin singulier ➔ au restaurant.", "arabicTranslation": "المطعم مكان مذكر مفرد ➔ au restaurant."}, {"id": "rev_ex4_4", "question": "4) ______ zoo", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Zoo est masculin singulier ➔ au zoo.", "arabicTranslation": "حديقة الحيوان مكان مذكر مفرد ➔ au zoo."}, {"id": "rev_ex4_5", "question": "5) ______ tour", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Tour (البرج) est féminin singulier ➔ à la tour.", "arabicTranslation": "البرج مكان مؤنث مفرد ➔ à la tour."}, {"id": "rev_ex4_6", "question": "6) ______ poste", "options": ["à la", "au", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Poste (مكتب البريد) est féminin singulier ➔ à la poste.", "arabicTranslation": "مكتب البريد مكان مؤنث مفرد ➔ à la poste."}, {"id": "rev_ex4_7", "question": "7) ______ cinéma", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Cinéma est masculin singulier ➔ au cinéma.", "arabicTranslation": "السينما مكان مذكر مفرد ➔ au cinéma."}, {"id": "rev_ex4_8", "question": "8) ______ hôtel", "options": ["à l'", "au", "à la", "aux", "à"], "correctIndex": 0, "explanation": "Hôtel commence par 'h' muet (voyelle) ➔ à l'hôtel.", "arabicTranslation": "الفندق يبدأ بحرف h صامت ➔ à l'hôtel."}, {"id": "rev_ex4_9", "question": "9) ______ club", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Club est masculin singulier ➔ au club.", "arabicTranslation": "النادي مكان مذكر مفرد ➔ au club."}, {"id": "rev_ex4_10", "question": "10) ______ pyramides", "options": ["aux", "au", "à la", "à l'", "à"], "correctIndex": 0, "explanation": "Pyramides est au pluriel (-s) ➔ aux pyramides.", "arabicTranslation": "الأهرامات جمع ينتهي بـ s ➔ aux pyramides."}, {"id": "rev_ex4_11", "question": "11) ______ jardin", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Jardin est masculin singulier ➔ au jardin.", "arabicTranslation": "الحديقة مكان مذكر مفرد ➔ au jardin."}, {"id": "rev_ex4_12", "question": "12) ______ magasin", "options": ["au", "à la", "à l'", "aux", "à"], "correctIndex": 0, "explanation": "Magasin est masculin singulier ➔ au magasin.", "arabicTranslation": "المتجر مكان مذكر مفرد ➔ au magasin."}, {"id": "rev_ex5_1", "question": "1. « Nous avons des amis. »\n➔ À la forme négative :", "options": ["Nous n'avons pas d'amis.", "Nous n'avons pas des amis.", "Nous ne avons pas d'amis."], "correctIndex": 0, "explanation": "L'article 'des' se transforme en 'd'' devant voyelle ➔ d'amis.", "arabicTranslation": "أداة الجمع des تتحول في النفي إلى d' أمام حرف متحرك a ➔ Nous n'avons pas d'amis."}, {"id": "rev_ex5_2", "question": "2. « Je vais au stade. »\n➔ À la forme négative :", "options": ["Je ne vais pas au stade.", "Je ne va pas au stade.", "Je n'ai pas au stade."], "correctIndex": 0, "explanation": "Négation simple : ne + verbe + pas ➔ Je ne vais pas.", "arabicTranslation": "نفي بسيط بحصر الفعل vais بين ne و pas ➔ Je ne vais pas au stade."}, {"id": "rev_ex5_3", "question": "3. « Nous sommes des amis. »\n➔ À la forme négative :", "options": ["Nous ne sommes pas des amis.", "Nous ne sommes pas d'amis.", "Nous n'avons pas des amis."], "correctIndex": 0, "explanation": "Attention : Avec le verbe ÊTRE, l'article 'des' NE change PAS !", "arabicTranslation": "⚠️ انتبه: مع فعل الكينونة être لا تتغير des بل تظل كما هي ➔ Nous ne sommes pas des amis."}, {"id": "rev_ex5_4", "question": "4. « Il a une nouvelle voiture. »\n➔ À la forme négative :", "options": ["Il n'a pas de nouvelle voiture.", "Il n'a pas une nouvelle voiture.", "Il ne a pas de nouvelle voiture."], "correctIndex": 0, "explanation": "L'article 'une' se transforme en 'de' à la négation.", "arabicTranslation": "تتحول أداة النكرة une في النفي إلى de ➔ Il n'a pas de nouvelle voiture."}, {"id": "rev_ex5_5", "question": "5. « Elle est une élève. »\n➔ À la forme négative :", "options": ["Elle n'est pas une élève.", "Elle n'est pas d'élève.", "Elle n'est pas de élève."], "correctIndex": 0, "explanation": "Attention : Avec le verbe ÊTRE, on conserve 'une' !", "arabicTranslation": "⚠️ انتبه: مع فعل الكينونة être تبقى أداة النكرة une كما هي بدون تغيير ➔ Elle n'est pas une élève."}], "examText": "Le garçon : Bonjour monsieur, vous voulez prendre le déjeuner au menu ou à la carte ? Ahmed : À la carte. Le garçon : Que voulez-vous comme entrée ? Ahmed : Des tomates et des concombres en salade. Le garçon : et le plat principal ? Ahmed : De la viande, du riz et des frites. Le garçon : Voulez-vous du dessert ? Ahmed : Oui, j'aime le gâteau.", "examTextArabic": "النادل: مرحباً سيدي، هل تريد تناول الغداء ضمن قائمة اليوم أم حسب الطلب؟ أحمد: حسب الطلب. النادل: ماذا تريد كطبق مقبلات؟ أحمد: طماطم وخيار وسلطة. النادل: والطبق الرئيسي؟ أحمد: لحم وأرز وبطاطس مقلية. النادل: هل تريد حلوى؟ أحمد: نعم، أحب الكعك.", "examQuestions": [{"section": "I. Compréhension du texte", "question": "1. Ahmed prend son repas :", "options": ["à la carte", "au menu", "au dîner"], "correctIndex": 0, "arabicTranslation": "يتناول أحمد وجبته : (حسب الطلب à la carte / قائمة اليوم au menu / في العشاء au dîner)"}, {"section": "I. Compréhension du texte", "question": "2. Ahmed demande comme plat principal :", "options": ["du poisson", "de la glace", "de la viande et du riz"], "correctIndex": 2, "arabicTranslation": "طلب أحمد كطبق رئيسي : (سمك / آيس كريم / لحم وأرز)"}, {"section": "I. Compréhension du texte", "question": "3. Ahmed va prendre :", "options": ["le petit-déjeuner", "le déjeuner", "le dîner"], "correctIndex": 1, "arabicTranslation": "أحمد سيتناول : (الإفطار / الغداء / العشاء)"}, {"section": "II. Grammaire", "question": "4. Nous ______ aux élèves. (parler)", "options": ["parlez", "parlons", "parle"], "correctIndex": 1, "arabicTranslation": "نحن [نتحدث] إلى التلاميذ. تصريف فعل parler مع nous ➔ parlons."}, {"section": "II. Grammaire", "question": "5. On peut prendre ______ boissons fraîches.", "options": ["du", "de l'", "des"], "correctIndex": 2, "arabicTranslation": "يمكننا تناول [مشروبات باردة]. كلمة boissons جمع ➔ نختار des."}, {"section": "II. Adjectifs Possessifs", "question": "6. Tu aimes ______ parents.", "options": ["ton", "ta", "tes"], "correctIndex": 2, "arabicTranslation": "أنت تحب [والديك]. كلمة parents جمع مع الضمير tu ➔ نختار tes."}, {"section": "II. Pronoms Personnels", "question": "7. « Je parle à mon ami » ➔ Je ______ parle.", "options": ["le", "lui", "leur"], "correctIndex": 1, "arabicTranslation": "«أنا أتحدث إلى صديقي» ➔ أنا أتحدث [إليه]. المفعول شخص مفرد مسبوق بـ à ➔ نختار lui."}, {"section": "II. Négation", "question": "8. Elle mange des légumes. ➔ Elle ne mange pas ______ légumes.", "options": ["des", "de", "les"], "correctIndex": 1, "arabicTranslation": "هي تأكل خضروات ➔ هي لا تأكل [خضروات]. أداة التجزئة des تتحول إلى de في النفي."}, {"section": "III. Situations officielles", "question": "9. Tu demandes au garçon l'addition, tu dis :", "options": ["L'addition, S.V.P !", "Que voulez-vous ?", "Bon appétit !"], "correctIndex": 0, "arabicTranslation": "تطلب من النادل الحساب والفاتورة، ماذا تقول؟ (الحساب لو سمحت! / ماذا تريد؟ / بالهناء والشفاء!)"}, {"section": "III. Situations officielles", "question": "10. Au restaurant, tu demandes le menu au garçon, tu dis :", "options": ["Je prends de la glace.", "Apportez-moi le menu, S.V.P !", "C'est combien ?"], "correctIndex": 1, "arabicTranslation": "في المطعم، تطلب قائمة الطعام من النادل، ماذا تقول؟ (أنا آخذ آيس كريم / أحضر لي القائمة لو سمحت! / كم الحساب؟)"}], "unit1PossessiveTable": [{"subject": "Je", "mascSingular": "Mon", "femSingular": "Ma", "plural": "Mes", "arabicSubject": "أنا", "exampleFr": "Je prends mon stylo, ma règle et mes livres."}, {"subject": "Tu", "mascSingular": "Ton", "femSingular": "Ta", "plural": "Tes", "arabicSubject": "أنت", "exampleFr": "Tu ranges ton cahier, ta trousse et tes stylos."}, {"subject": "Il / Elle", "mascSingular": "Son", "femSingular": "Sa", "plural": "Ses", "arabicSubject": "هو / هي", "exampleFr": "Il fait son devoir, écoute sa mère et aide ses amis."}, {"subject": "Nous", "mascSingular": "Notre", "femSingular": "Notre", "plural": "Nos", "arabicSubject": "نحن", "exampleFr": "Nous aimons notre école, notre professeur et nos camarades."}, {"subject": "Vous", "mascSingular": "Votre", "femSingular": "Votre", "plural": "Vos", "arabicSubject": "أنتم", "exampleFr": "Vous prenez votre sac, votre voiture et vos clés."}, {"subject": "Ils / Elles", "mascSingular": "Leur", "femSingular": "Leur", "plural": "Leurs", "arabicSubject": "هم / هن", "exampleFr": "Ils invitent leur ami, leur cousine et leurs professeurs."}]}, "revisionDocs": [{"id": 1, "pageNumber": "p. 67", "titleFr": "Document (1) : Lettre d'invitation", "titleAr": "الوثيقة 1 : خطاب دعوة لحفل عيد ميلاد", "documentType": "Une lettre (رسالة)", "textFr": "Alexandrie, le 15 Novembre\nChère Noha,\n    Je t'invite à une petite fête à l'occasion de mon anniversaire, le jeudi 30 Novembre, à 20 heures à la maison. Je vais inviter nos amies Racha et Rana. Ma cousine Salma va apporter ses CD. On va chanter, danser et manger des gâteaux. Nous allons être contentes de te voir.\nÀ bientôt\nTon amie\nHoda", "textAr": "الإسكندرية، 15 نوفمبر\nعزيزتي نهى،\nأدعوكِ إلى حفلة صغيرة بمناسبة عيد ميلادي، يوم الخميس 30 نوفمبر في تمام الساعة الثامنة مساءً في المنزل. سوف أدعو صديقتينا رشا ورنا. وابنة عمي سلمى ستحضر أسطواناتها الموسيقية (CDs). سوف نغني ونرقص ونأكل الكعك والجاتوه. سنكون سعيدات جداً برؤيتكِ.\nإلى اللقاء قريباً\nصديقتكِ\nهدى", "vocabulary": [{"first": "une fête", "second": "حفلة"}, {"first": "à l'occasion de", "second": "بمناسبة"}, {"first": "apporter des CD", "second": "يُحضر أسطوانات"}, {"first": "chanter et danser", "second": "يغني ويرقص"}, {"first": "contentes de te voir", "second": "مسرورات برؤيتك"}], "mcqQuestions": [{"id": "d1_q1", "questionFr": "1. Ce document est ............... .", "questionAr": "هذه الوثيقة عبارة عن :", "options": ["une lettre", "un dialogue", "un texte"], "correctIndex": 0, "explanationAr": "الوثيقة تبدأ بالمدينة والتاريخ (Alexandrie, le 15 Novembre) وتنتهي بتوقيع (Ton amie Hoda) لذا فهي خطاب (une lettre)."}, {"id": "d1_q2", "questionFr": "2. C'est l'anniversaire ............... .", "questionAr": "هذا عيد ميلاد :", "options": ["de Noha", "de Hoda", "de Salma"], "correctIndex": 1, "explanationAr": "هدى هي كاتبة الرسالة وتقول: «à l'occasion de mon anniversaire» أي بمناسبة عيد ميلادي أنا."}, {"id": "d1_q3", "questionFr": "3. L'anniversaire va être ............... Novembre.", "questionAr": "حفل عيد الميلاد سيكون يوم :", "options": ["le quinze", "le vingt", "le trente"], "correctIndex": 2, "explanationAr": "تاريخ الحفل المذكور في النص هو: «le jeudi 30 Novembre» (30 نوفمبر = le trente)."}, {"id": "d1_q4", "questionFr": "4. La fête va être ............... .", "questionAr": "الحفلة ستقام :", "options": ["le soir", "l'après-midi", "le matin"], "correctIndex": 0, "explanationAr": "الساعة 20:00 (à 20 heures) في التوقيت الفرنسي تعني الثامنة مساءً (le soir)."}], "trueFalseQuestions": [{"id": "d1_tf1", "statementFr": "1. Hoda écrit à sa cousine.", "statementAr": "هدى تكتب لابنة عمها.", "isTrue": false, "explanationAr": "خطأ (Faux): هدى تكتب لصديقتها نهى (Chère Noha / Ton amie Hoda)، بينما ابنة عمها هي سلمى (Ma cousine Salma)."}, {"id": "d1_tf2", "statementFr": "2. Racha est l'amie de Noha.", "statementAr": "رشا هي صديقة لنهى.", "isTrue": true, "explanationAr": "صحيح (Vrai): هدى تقول في النص «nos amies Racha et Rana» أي صديقاتنا المشتركات."}, {"id": "d1_tf3", "statementFr": "3. Hoda habite à Alexandrie.", "statementAr": "هدى تسكن في الإسكندرية.", "isTrue": true, "explanationAr": "صحيح (Vrai): كُتب الخطاب من الإسكندرية «Alexandrie, le 15 Novembre»."}], "completionQuestions": [{"id": "d1_op1", "promptFr": "1. Qui va apporter les CD?", "promptAr": "من الذي سيحضر أسطوانات الأغاني (CD)?", "modelAnswerFr": "Salma (la cousine de Hoda) va apporter ses CD.", "modelAnswerAr": "سلمى (ابنة عم هدى) هي التي ستحضر الأسطوانات.", "hint": "Salma va apporter ses CD."}, {"id": "d1_op2", "promptFr": "2. Où est-ce que la fête va être?", "promptAr": "أين ستقام الحفلة؟", "modelAnswerFr": "La fête va être à la maison (de Hoda).", "modelAnswerAr": "ستقام الحفلة في المنزل (منزل هدى).", "hint": "à la maison"}, {"id": "d1_op3", "promptFr": "3. Qu'est-ce qu' on va faire à la fête?", "promptAr": "ماذا سيفعلون في الحفل؟", "modelAnswerFr": "On va chanter, danser et manger des gâteaux.", "modelAnswerAr": "سوف يغنون، يرقصون، ويتناولون الجاتوه والكعك.", "hint": "chanter, danser et manger des gâteaux"}]}, {"id": 2, "pageNumber": "p. 68", "titleFr": "Document (2) : À l'hôpital", "titleAr": "الوثيقة 2 : في المستشفى", "documentType": "Un texte descriptif (نص وصفي)", "textFr": "À l'hôpital\nLe médecin examine les malades, il écrit l'ordonnance. L'infirmière donne les médicaments aux malades à des heures fixes. Sur les lits, il y a des couvertures blanches. Le bureau de l'infirmière est près des malades. Des parents et des amis visitent les malades et leur apportent des fleurs.", "textAr": "في المستشفى\nيفحص الطبيب المرضى، ويكتب الروشتة الطبية. وتعطي الممرضة الأدوية للمرضى في مواعيد محددة. وعلى الأسِرة، توجد أغطية وبطاطين بيضاء. مكتب الممرضة قريب من المرضى. ويزور الأقارب والأصدقاء المرضى ويحضرون لهم الزهور.", "vocabulary": [{"first": "examine les malades", "second": "يفحص المرضى"}, {"first": "l'ordonnance", "second": "الروشتة الطبية"}, {"first": "des heures fixes", "second": "مواعيد ثابتة / محددة"}, {"first": "des couvertures", "second": "أغطية / بطاطين"}, {"first": "apportent des fleurs", "second": "يحضرون زهوراً"}], "mcqQuestions": [{"id": "d2_q1", "questionFr": "1. L'infirmière donne les médicaments ...............", "questionAr": "تعطي الممرضة الأدوية لـ :", "options": ["aux médecins", "aux malades", "aux parents"], "correctIndex": 1, "explanationAr": "في النص: «L'infirmière donne les médicaments aux malades» للمرضى."}, {"id": "d2_q2", "questionFr": "2. Sur le lit, il y a ...............", "questionAr": "يوجد على السرير :", "options": ["des fleurs", "des médicaments", "des couvertures"], "correctIndex": 2, "explanationAr": "في النص: «Sur les lits, il y a des couvertures blanches» أغطية بيضاء."}, {"id": "d2_q3", "questionFr": "3. ............... écrit les ordonnances.", "questionAr": "الذي يكتب الروشتات هو :", "options": ["Le médecin", "L'infirmière", "Le malade"], "correctIndex": 0, "explanationAr": "في النص: «Le médecin examine les malades, il écrit l'ordonnance»."}], "trueFalseQuestions": [{"id": "d2_tf1", "statementFr": "1. L'infirmière travaille dans un hôpital.", "statementAr": "الممرضة تعمل في مستشفى.", "isTrue": true, "explanationAr": "صحيح (Vrai): العنوان والنص يتحدثان عن المستشفى (À l'hôpital)."}, {"id": "d2_tf2", "statementFr": "2. Le médecin examine les malades.", "statementAr": "الطبيب يفحص المرضى.", "isTrue": true, "explanationAr": "صحيح (Vrai): جملة صريحة في بداية النص."}, {"id": "d2_tf3", "statementFr": "3. Le médecin donne les médicaments à des heures fixes.", "statementAr": "الطبيب يعطي الأدوية في مواعيد محددة.", "isTrue": false, "explanationAr": "خطأ (Faux): الممرضة هي من تعطي الدواء (L'infirmière donne les médicaments)."}, {"id": "d2_tf4", "statementFr": "4. L'infirmière a un bureau près des malades.", "statementAr": "للممرضة مكتب بجوار المرضى.", "isTrue": true, "explanationAr": "صحيح (Vrai): «Le bureau de l'infirmière est près des malades»."}], "completionQuestions": [{"id": "d2_op1", "promptFr": "1. Le médecin ............... les malades, il écrit une ............... .", "promptAr": "أكمل: الطبيب ..... المرضى، ويكتب ..... .", "modelAnswerFr": "examine / ordonnance", "modelAnswerAr": "يفحص (examine) / روشتة (ordonnance).", "hint": "examine - ordonnance"}, {"id": "d2_op2", "promptFr": "2. Les visiteurs apportent des ............... pour les malades.", "promptAr": "أكمل: يُحضر الزائرون ..... للمرضى.", "modelAnswerFr": "fleurs", "modelAnswerAr": "زهوراً (fleurs).", "hint": "fleurs"}]}, {"id": 3, "pageNumber": "p. 69", "titleFr": "Document (3) : Au restaurant", "titleAr": "الوثيقة 3 : في المطعم", "documentType": "Un dialogue (حوار)", "textFr": "Au restaurant\nLe garçon : Bonjour monsieur, vous déjeunez au menu ou à la carte?\nLe client : À la carte.\nLe garçon : Que voulez-vous comme entrée?\nLe client : Des tomates et des concombres en salade.\nLe garçon : Et le plat principal?\nLe client : De la viande, du riz et des frites.\nLe garçon : Voulez-vous du dessert?\nLe client : Oui, du gâteau.", "textAr": "في المطعم\nالنادل : مرحباً سيدي، هل تتناول الغداء وفقاً لقائمة الوجبات الثابتة (au menu) أم تختار أصنافاً محددة (à la carte)؟\nالزبون : أصناف محددة من القائمة (À la carte).\nالنادل : ماذا تود كمقبلات؟\nالزبون : طماطم وخيار في طبق سلطة.\nالنادل : والطبق الرئيسي؟\nالزبون : لحم، وأرز، وبطاطس محمرة.\nالنادل : هل ترغب في تحلية؟\nالزبون : نعم، قطعة جاتوه.", "vocabulary": [{"first": "au menu", "second": "وجبة محددة مسبقاً"}, {"first": "à la carte", "second": "طلب أصناف مفردة"}, {"first": "comme entrée", "second": "كمقبلات"}, {"first": "le plat principal", "second": "الطبق الرئيسي"}, {"first": "le dessert", "second": "الحلوى / التحلية"}], "mcqQuestions": [{"id": "d3_q1", "questionFr": "1. Le client prend son repas ............... .", "questionAr": "يتناول الزبون وجبته :", "options": ["à la carte", "au menu", "au dîner"], "correctIndex": 0, "explanationAr": "سأله النادل فأجاب: «Le client : À la carte»."}, {"id": "d3_q2", "questionFr": "2. Le client demande ............... comme plat principal.", "questionAr": "يطلب الزبون ..... كطبق رئيسي :", "options": ["du gâteau", "de la salade", "de la viande et du riz"], "correctIndex": 2, "explanationAr": "قال الزبون عن الطبق الرئيسي: «De la viande, du riz et des frites»."}, {"id": "d3_q3", "questionFr": "3. Le client prend ............... .", "questionAr": "يتناول الزبون وجبة :", "options": ["le petit-déjeuner", "le déjeuner", "le dîner"], "correctIndex": 1, "explanationAr": "سأله النادل: «vous déjeunez...» ومشتقة من فعل déjeuner أي يتناول الغداء."}], "trueFalseQuestions": [{"id": "d3_tf1", "statementFr": "1. Ce dialogue est dans un restaurant.", "statementAr": "يدور هذا الحوار في مطعم.", "isTrue": true, "explanationAr": "صحيح (Vrai): العنوان والحوار بين النادل والزبون في المطعم (Au restaurant)."}, {"id": "d3_tf2", "statementFr": "2. Le client n'aime     function renderQuizQuestionsList(questions) {

      return questions.map(q => `

          <p class="text-xs font-bold text-slate-900 font-french" dir="ltr">${q.question || q.questionFr || ''}</p>
          ${q.arabicTranslation || q.questionAr ? `<p class="text-[11px] text-slate-500">${q.arabicTranslation || q.questionAr}</p>` : ''}
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-1.5" dir="ltr">
            ${(q.options || []).map((opt, oIdx) => `
              <button onclick="checkQuizOption(this, ${oIdx === q.correctIndex}, '${(q.explanation || q.explanationAr || '').replace(/['"]/g, ' ')}')" class="quiz-opt-btn p-2 rounded-lg border border-slate-200 bg-white text-xs font-french font-semibold text-slate-800 text-left hover:border-indigo-300 transition">

        btn.classList.add('bg-slate-100', 'text-slate-700');

      event.target.classList.remove('bg-slate-100', 'text-slate-700');
      filterUnit1Vocab();

    function filterUnit1Vocab() {
      const q = (document.getElementById('u1VocabSearch').value || '').trim().toLowerCase();
      document.querySelectorAll('.vocab-item').forEach(item => {
        const cat = item.getAttribute('data-cat');
        const fr = item.getAttribute('data-fr');
        const ar = item.getAttribute('data-ar');
        const matchCat = (activeU1Cat === 'ALL' || cat === activeU1Cat);
        const matchSearch = (!q || fr.includes(q) || ar.includes(q));
        item.style.display = (matchCat && matchSearch) ? 'flex' : 'none';
      });
    }

    function startExamTimer() {
      if (examTimerInterval) clearInterval(examTimerInterval);
      examTimeRemaining = 3600;
      examTimerInterval = setInterval(() => {
        if (examTimeRemaining <= 0) {
          clearInterval(examTimerInterval);
          return;
        }
        examTimeRemaining--;
        const mins = Math.floor(examTimeRemaining / 60);
        const secs = examTimeRemaining % 60;
        const display = document.getElementById('examTimerDisplay');
        if (display) {
          display.innerText = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
      }, 1000);
    }
